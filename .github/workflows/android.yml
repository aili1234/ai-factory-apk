name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create clean APK project
        run: |
          rm -rf apkbuild
          mkdir -p apkbuild/www
          cd apkbuild

          cat > package.json <<'JSON'
          {"name":"ai-factory-apk","version":"1.0.0","dependencies":{"@capacitor/android":"latest","@capacitor/cli":"latest","@capacitor/core":"latest"}}
          JSON

          cat > capacitor.config.json <<'JSON'
          {"appId":"com.aifactory.real","appName":"AI Factory Real APK","webDir":"www"}
          JSON

          cat > www/index.html <<'HTML'
          <!doctype html>
          <html>
          <head><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI Factory Real APK</title></head>
          <body style="font-family:Arial;padding:25px">
            <h1>AI Factory Real APK</h1>
            <p>Real installable APK built by GitHub Actions.</p>
            <button onclick="alert('APK button works')">Test Button</button>
          </body>
          </html>
          HTML

          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd apkbuild/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-real
          path: apkbuild/android/app/build/outputs/apk/debug/app-debug.apk
